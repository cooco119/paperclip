name: Overlord CI

on:
  pull_request:
    branches:
      - "overlord/**"
  push:
    branches:
      - "overlord/main"

concurrency:
  group: overlord-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Run tests
        run: pnpm test:run

      - name: Build
        run: pnpm build

  upstream-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'push' && github.ref == 'refs/heads/overlord/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check upstream drift
        run: |
          git remote add upstream https://github.com/paperclipai/paperclip.git || true
          git fetch upstream master --depth=50
          behind=$(git rev-list --count HEAD..upstream/master)
          echo "Commits behind upstream: $behind"
          if [ "$behind" -gt 50 ]; then
            echo "::warning::Fork is $behind commits behind upstream. Consider rebasing."
          fi
